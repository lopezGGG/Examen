<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Cuestionario interactivo - examen</title>
  <style>
    body{font-family:Segoe UI,Roboto,Arial;margin:20px;color:#222}
    .container{max-width:900px;margin:0 auto}
    .stats{display:flex;gap:20px;margin-bottom:20px;padding:12px;background:#f0f0f0;border-radius:8px}
    .stat{flex:1}
    .stat-label{font-size:0.9em;color:#666}
    .stat-value{font-size:1.8em;font-weight:bold}
    .stat-value.correct{color:green}
    .stat-value.incorrect{color:red}
    .stat-value.neutral{color:#0366d6}
    .question{border:1px solid #ddd;padding:16px;border-radius:8px;margin-bottom:12px}
    .choices{margin-top:10px}
    .choice{display:block;margin:6px 0}
    .controls{margin-top:12px}
    .btn{padding:8px 12px;border-radius:6px;border:0;background:#0366d6;color:#fff;cursor:pointer}
    .btn.secondary{background:#6c757d}
    .correct{color:green}
    .wrong{color:red}
    textarea{width:100%;height:160px}
    .small{font-size:0.9em;color:#555}
    .question-nav{margin-bottom:16px;padding:12px;background:#f9f9f9;border-radius:8px;max-height:200px;overflow-y:auto}
    .question-nav-label{font-weight:bold;margin-bottom:8px;display:block}
    .question-buttons{display:grid;grid-template-columns:repeat(auto-fill,minmax(50px,1fr));gap:6px}
    .question-btn{padding:6px 8px;border-radius:4px;border:1px solid #ddd;background:#fff;cursor:pointer;font-size:0.85em;transition:all 0.2s}
    .question-btn:hover{background:#e0e0e0}
    .question-btn.active{background:#0366d6;color:#fff;border-color:#0366d6}
    .question-btn.answered-correct{background:#c6f6d5;border-color:green;color:green}
    .question-btn.answered-incorrect{background:#fed7d7;border-color:red;color:red}
  </style>
</head>
<body>
  <div class="container">
    <h1>Cuestionario interactivo</h1>
    <p class="small">El script intenta cargar automáticamente <code>exam.txt</code> en la misma carpeta. Si no puede cargarlo, pega el contenido del archivo en el área de texto y presiona "Parsear".</p>

    <div id="loader">Intentando cargar <code>exam.txt</code>...</div>

    <div id="import" style="display:none">
      <textarea id="raw"></textarea>
      <div style="margin-top:8px"><button id="parseBtn" class="btn">Parsear</button></div>
    </div>

    <div id="quiz" style="display:none">
      <div id="stats" class="stats" style="display:none">
        <div class="stat">
          <div class="stat-label">Correctas</div>
          <div id="correctCount" class="stat-value correct">0</div>
        </div>
        <div class="stat">
          <div class="stat-label">Incorrectas</div>
          <div id="incorrectCount" class="stat-value incorrect">0</div>
        </div>
        <div class="stat">
          <div class="stat-label">Sin responder</div>
          <div id="unansweredCount" class="stat-value neutral">0</div>
        </div>
      </div>

      <div id="questionNav" class="question-nav" style="display:none">
        <label class="question-nav-label">Navegar a pregunta:</label>
        <div id="questionButtons" class="question-buttons"></div>
      </div>

      <div id="qwrap"></div>
      <div class="controls">
        <button id="prev" class="btn secondary">Anterior</button>
        <button id="next" class="btn">Siguiente</button>
        <button id="finish" class="btn" style="display:none">Terminar y ver resultado</button>
      </div>
      <div id="result" style="margin-top:14px"></div>
    </div>

    <div id="review" style="display:none;margin-top:12px"></div>
  </div>

<script>
// Datos de preguntas embebidas
const PREGUNTAS_EMBEBIDAS = [
  {question:"When many Scrum Teams are working on the same product, should all of their Increments be integrated every Sprint?",choices:{A:"Yes, but only for Scrum Teams whose work has dependencies.",B:"Yes, otherwise the Product Owners (and stakeholders) may not be able to accurately inspect what is done.",C:"No, each Scrum Team stands alone.",D:"No, that is far too hard and must be done in a hardening Sprint."},correct:["B"]},
  {question:"When can a Development Team cancel a Sprint?",choices:{A:"It can't. Only Product Owners can cancel Sprints.",B:"When functional expectations are not well understood.",C:"When the Product Owner is absent too often.",D:"When the selected Product Backlog items for the Sprint become unachievable.",E:"When a technical dependency cannot be resolved."},correct:["A"]},
  {question:"Which output from Sprint Planning provides the Development Team with a target and overarching direction for the Sprint?",choices:{A:"The Sprint Backlog.",B:"The Sprint Goal",C:"The release plan.",D:"Sprint Review minutes."},correct:["B"]},
  {question:"How should a Development Team deal with non-functional requirements?",choices:{A:"Ensure every Increment meets them.",B:"Make sure the release department understands these requirements, but it is not the Development Team's responsibility.",C:"Handle them during the Integration Sprint preceding the Release Sprint.",D:"Assign them to the lead developers on the team."},correct:["A"]},
  {question:"When is a Sprint over?",choices:{A:"When the Product Owner says it is done.",B:"When all Product Backlog items meet their definition of Done.",C:"When all the tasks are completed.",D:"When the time-box expires."},correct:["D"]},
  {question:"True or False: Scrum has a role called Project Manager.",choices:{A:"True",B:"False"},correct:["B"]},
  {question:"What are two effective ways for the Scrum Team to make non-functional requirements visible? (Choose two.)",choices:{A:"Put them on a separate list on the Scrum board, available for all to see.",B:"Add them to the Product Backlog to ensure transparency.",C:"Run the integration and regression tests before the end of the Sprint, and capture the open work for the Sprint Backlog of the next Sprint.",D:"Add them to the definition of Done so the work is taken care of every Sprint."},correct:["B","D"]},
  {question:"How much time is required after a Sprint to prepare for the next Sprint?",choices:{A:"The break between Sprints is time-boxed to 1 week for 30 day Sprints, and usually less for shorter sprints.",B:"Enough time for the requirements for the next Sprint to be determined and documented.",C:"Enough time for the Development team to finish the testing from the last Sprint.",D:"None. A new Sprint starts immediately following the end of the previous Sprint.",E:"All of the above are allowed depending on the situation."},correct:["D"]},
  {question:"During Sprint Planning the Product Owner and the Developers are unable to reach an understanding about the highest order Product Backlog items. Because of this, the Developers are unable to determine how many Product Backlog items they can forecast for the upcoming Sprint. However, the Product Owner and the Developers are able to agree on a Sprint Goal. Which of the following actions should the Scrum Master support? (Choose two.)",choices:{A:"Cancel the Sprint. Send the entire team to an advanced Scrum training and then start a new Sprint.",B:"Forecast the Product Backlog items that are most likely to meet the Sprint Goal and create the Sprint Backlog. Conclude Sprint Planning and start the development work. Continue to analyze, decompose, and create additional functionality during the Sprint.",C:"Continue the Sprint Planning event past its timebox until an adequate number of Product Backlog items are well enough understood for the Developers to make a complete forecast. Then start the Sprint.",D:"During the next Sprint Retrospective discuss why this happened and what changes will make it less likely to recur.",E:"Ask everyone to take as much time as needed to analyze the Product Backlog first, and then reconvene another Sprint Planning meeting."},correct:["B","D"]},
  {question:"Who can cancel a Sprint?",choices:{A:"The Scrum Team.",B:"The Scrum Master.",C:"The Product Owner.",D:"The Stakeholders."},correct:["C"]},
  {question:"Which of the following is required by Scrum?",choices:{A:"Sprint Retrospective.",B:"Members must be stand up at the Daily Scrum.",C:"Sprint Burndown Chart.",D:"Release planning.",E:"All of the above."},correct:["A"]},
  {question:"What is the purpose of a Sprint Review?",choices:{A:"To take time to judge the validity of the project.",B:"To inspect the product Increment with the stakeholders and collect feedback on next steps.",C:"To review the Scrum Team's activities and processes during the Sprint.",D:"To build team sprint."},correct:["B"]},
  {question:"Who determines when it is appropriate to update the Sprint Backlog during a Sprint?",choices:{A:"The Project Manager.",B:"The Development Team.",C:"The Scrum Team.",D:"The Product Owner."},correct:["B"]},
  {question:"Who must attend the Daily Scrum?",choices:{A:"The Scrum Master and Product Owner.",B:"The Development Team.",C:"The Development Team and Product Owner.",D:"The Scrum Team.",E:"The Development Team and Scrum Master."},correct:["B"]},
  {question:"When do Development Team members take ownership of a Sprint Backlog item? (Choose the best answer.)",choices:{A:"At the Sprint planning meeting.",B:"During the Daily Scrum.",C:"Never. All Sprint Backlog Items are owned by the entire Scrum Team.",D:"Whenever a team member can accommodate more work."},correct:["C"]},
  {question:"True or False: The purpose of a Sprint is to produce a valuable, useful Increment.",choices:{A:"True",B:"False"},correct:["A"]},
  {question:"Who creates the definition of Done?",choices:{A:"The Scrum Master as he/she is responsible for the Development Team's productivity.",B:"The Scrum Team, in a collaborative effort where the result is the common denominator of all members' definition.",C:"The Product Owner as he/she is responsible for the product's success.",D:"The development organization (or Development Team if none is available from the development organization)."},correct:["B"]},
  {question:"Five new Scrum Teams have been created to build one product. A few of the developers on one of the Scrum Teams ask the Scrum Master how to coordinate their work with the other teams. What should the Scrum Master do?",choices:{A:"Teach the Product Owner to work with the lead developers on ordering Product Backlog in a way to avoid too much technical and development overlap during a Sprint.",B:"Teach them that it is their responsibility to work with the other teams to create an integrated Increment that is inclusive of all five team's work.",C:"Collect the Sprint tasks from the teams at the end of their Sprint Planning and merge that into a consolidated plan for the entire Sprint.",D:"Visit the five teams each day to inspect that their Sprint Backlogs are aligned."},correct:["B"]},
  {question:"Which two things should the Development Team do during the first Sprint? (Choose two.)",choices:{A:"Make up a plan for the rest of the project.",B:"Analyze, describe, and document the requirements for the subsequent Sprints.",C:"Develop at least one piece of functionality.",D:"Analyze, design, and describe the complete architecture and infrastructure.",E:"Create an increment of potentially releasable software."},correct:["C","E"]},
  {question:"What are three ways Scrum promotes self-organization? (Choose three.)",choices:{A:"By not allowing documentation.",B:"By the Development Team deciding what work to do in a Sprint.",C:"By preventing stakeholders from entering the development room.",D:"By removing titles for Development Team members.",E:"By being a lightweight framework."},correct:["B","D","E"]},
  {question:"What is the key concern when multiple Development Teams are working from the same Product Backlog?",choices:{A:"Minimizing dependencies between teams.",B:"Clear definition of requirements.",C:"Meeting original scope projections.",D:"Making sure there's enough work for everyone on every team.",E:"Maximizing velocity"},correct:["A"]},
  {question:"What does it mean to say that an event has a time-box?",choices:{A:"The event must happen at a set time.",B:"The event must happen by a given time.",C:"The event must take at least a minimum amount of time.",D:"The event can take no more than a maximum amount of time."},correct:["D"]},
  {question:"Which outcome is expected as Scrum Teams mature?",choices:{A:"They will improve their definition of Done to include more stringent criteria.",B:"The Sprint Retrospectives will grow to be longer than 4 hours.",C:"There is no need for a time-boxed Sprint.",D:"Sprint Reviews will no longer be needed.",E:"A Scrum Master is no longer needed since they are a mature team now."},correct:["A"]},
  {question:"When must a Scrum Team release each Increment?",choices:{A:"When it makes sense to release it.",B:"When the Scrum Team finishes their work.",C:"Whenever the product is free of defects.",D:"After every Sprint, without exception."},correct:["A"]},
  {question:"A properly functioning Scrum Team will have at least one Release Sprint and may well have several.",choices:{A:"True",B:"False"},correct:["B"]},
  {question:"Scrum is a methodology that tells in detail how to build software incrementally.",choices:{A:"True",B:"False"},correct:["B"]},
  {question:"For which is the Scrum Master responsible?",choices:{A:"Managing the performance of the Scrum Team.",B:"The meetings and the objectives that a Scrum Team sets for itself.",C:"The Scrum framework being adopted and used properly.",D:"Keeping track of resource allocation."},correct:["C"]},
  {question:"The Developers ask their Product Owner to re-order the Product Backlog. The team is waiting for an external supplier to deliver a component. Without that component there will not be enough work in the next Sprint to occupy the full team. As the Scrum Master, what advice would you give the Product Owner?",choices:{A:"Remind the Product Owner that his primary concern is the flow of value reflected in the ordering of the Product Backlog.",B:"Tell the Product Owner to re-order the Product Backlog so the work involving the external component can be planned in a separate sprint.",C:"Tell the Product Owner that the Product Backlog should be ordered to maximize utilization of the Development Team."},correct:["A"]},
  {question:"As the Sprint Planning meeting progresses, the Development Team sees that the workload is greater than they can handle. Which two are valid actions? (Choose two.)",choices:{A:"Recruit additional Development Team members before the work can begin.",B:"The Development Team ensures that the Product Owner is aware, starts the Sprint, and monitors progress.",C:"Cancel the Sprint.",D:"Remove or change selected Product Backlog items.",E:"The Development Team works overtime during this Sprint."},correct:["B","D"]},
  {question:"Currently, your Development Teams are organized to address a single layer only (for example, front end, middle tier, back end, and interfaces). What are three things to consider when deciding to move away from such component teams toward feature teams? (Choose three.)",choices:{A:"You cannot do Scrum without feature teams.",B:"Productivity may suffer when making this kind of move.",C:"Getting support from the business side first helps.",D:"Feature teams have less communication overhead.",E:"With feature teams, it is easier to calculate the productivity per team."},correct:["B","D","E"]},
  {question:"During a Sprint, when is new work or further decomposition of work added to the Sprint Backlog?",choices:{A:"When the Product Owner identifies new work.",B:"As soon as possible after they are identified.",C:"When the Scrum Master has time to enter them.",D:"During the Daily Scrum after the Development Team approves them."},correct:["B"]},
  {question:"What is the main reason for the Scrum Master to be at the Daily Scrum?",choices:{A:"To gather status and progress information to report to management.",B:"To write down any changes to the Sprint Backlog, including adding new items, and tracking progress on the burn-down.",C:"They do not have to be there; they only need to ensure the Development Team has a Daily Scrum.",D:"To make sure every team member answers the three questions."},correct:["C"]},
  {question:"You have six teams using a traditional method to deliver a product. Your management has asked you to start using Scrum. In the initial project there were separate plans and teams for the layers of a software system, i.e. one for the front-end, one for the middle tier, one for the back-end, and one for the interfaces and services. This resembles what is known as component teams. But you have read that it's a good idea to have teams organized by feature. What are the advantages of keeping component teams while starting Scrum?",choices:{A:"There's less initial disruption than organizing into new teams. As they start, they will discover what works best, and how to potentially re-organize towards this.",B:"Component teams generally have the skills needed to create a working Increment of software that provides business value.",C:"Because they have worked together for some time, they are likely able to start producing shippable Increments faster that new feature teams would.",D:"There are fewer cross-team dependencies than working in feature teams."},correct:["A"]},
  {question:"How should Product Backlog items be chosen when multiple Scrum Teams work from the same Product Backlog?",choices:{A:"The Scrum Team with the highest velocity pulls Product Backlog items first.",B:"The Development Teams pull in work in agreement with the Product Owner.",C:"The Product Owner should provide each team with its own Product Backlog.",D:"Each Scrum Team takes an equal numbers of items.",E:"The Product Owner decides."},correct:["B"]},
  {question:"How often should Scrum Team membership change?",choices:{A:"As needed, while taking into account a short term reduction in productivity.",B:"Never, because it reduces productivity.",C:"As needed, with no special allowance for changes in productivity.",D:"Every Sprint to promote shared learning."},correct:["A"]},
  {question:"Who should make sure everyone on the Scrum Team does his or her tasks for the Sprint?",choices:{A:"The Project Manager.",B:"The Product Owner.",C:"The Scrum Master.",D:"The Scrum Team.",E:"All of the above."},correct:["D"]},
  {question:"When is it most appropriate for a Development Team to change the definition of Done?",choices:{A:"During Spring Planning.",B:"Prior to starting a new Sprint.",C:"During the Sprint Retrospective.",D:"Prior to starting a new project."},correct:["C"]},
  {question:"The Daily Scrum is an event that happens every day. What would be three key concerns if the frequency were to be lowered to every two or three days? (Choose three.)",choices:{A:"Opportunities to inspect and adapt the Sprint Backlog are lost.",B:"Impediments are raised and resolved more slowly.",C:"The Product Owner cannot accurately report progress to the stakeholders.",D:"Too much work is spent updating the Scrum board before the meeting.",E:"The Scrum Master loses the ability to update the Gantt chart properly.",F:"The Sprint plan may become inaccurate."},correct:["A","B","F"]},
  {question:"Which statement best describes Scrum?",choices:{A:"A defined and predictive process that conforms to the principles of Scientific Management.",B:"A complete methodology that defines how to develop software.",C:"A cookbook that defines best practices for software development.",D:"A framework within which complex products in complex environments are developed."},correct:["D"]},
  {question:"Which Scrum Values are exhibited by not building Product Backlog items that have low business value? (Choose three.)",choices:{A:"Economic Value Added.",B:"Respect.",C:"Focus.",D:"Earned Value.",E:"Courage."},correct:["B","C","E"]},
  {question:"Who creates a Product Backlog Item's estimate?",choices:{A:"The Development Team after clarifying requirements with the Product Owner.",B:"The Product Owner with input from the Development Team.",C:"The most senior people in the organization, including architects and subject matter experts.",D:"The Scrum Master.",E:"The Development Team, alone."},correct:["A"]},
  {question:"Who starts the Daily Scrum?",choices:{A:"The person coming in last. This encourages people to be on time and helps to stay within the time-box.",B:"Whoever the Development Team decides should start.",C:"The person who has the token.",D:"The Scrum Master. This ensures that the Development Team has the meeting and stays within the time-box.",E:"The person who last broke the build."},correct:["B"]},
  {question:"You are the Scrum Master on a newly formed Scrum Team. Which three of the following activities would probably help the team in starting up? (Choose three.)",choices:{A:"Introduce a bonus system for the top performers in the team.",B:"Have the Scrum Team members introduce themselves to each other and give a brief background of their skills and work history.",C:"Have the development managers for each Development Team member introduce their direct reports and go over their responsibilities on the Scrum Team.",D:"Ensure the Scrum Team members have compatible personalities.",E:"Ensure the team understands they need a definition of Done.",F:"Ask the Product Owner to discuss the product or project, its history, goals, and context, as well as answer questions."},correct:["B","E","F"]},
  {question:"A Development Team selects a set of Product Backlog items for a Sprint Backlog with the intent to get the selected items Done by the end of the Sprint. Which three phrases best describe the purpose of a definition of Done? (Choose three.)",choices:{A:"It controls whether the developers have performed their tasks.",B:"It provides a template for elements that need to be included in the technical documentation.",C:"It creates transparency over the work inspected at the Sprint Review.",D:"It trucks the percent completeness of a Product Backlog item.",E:"It guides the Development Team is creating a forecast at the Sprint Planning.",F:"It defines what it takes for an Increment to be ready for release."},correct:["C","E","F"]},
  {question:"Select two ways in which technical debt impacts transparency. (Choose two.)",choices:{A:"When calculated and estimated, the total amount of technical debt shows exactly how long until the Product Owner can release the Increment.",B:"It leads to false assumptions about the current state of the system, specifically of an Increment being releasable at the end of a Sprint.",C:"As development progresses and code is added, the system becomes more difficult to stabilize, which results in future work being slowed down in unpredictable ways.",D:"It enhances transparency for the Product Owner as a Development Team is not allowed to do additional feature development in a Sprint as long as there is technical debt."},correct:["B","C"]},
  {question:"Which of these may a Development Team deliver at the end of a Sprint?",choices:{A:"Failing unit tests, to identify acceptance tests for the next Sprint.",B:"An increment of software with minor known bugs in it.",C:"An increment of working software that is done.",D:"A single document, if that is what the Scrum Master asked for."},correct:["C"]},
  {question:"How much of the Sprint Backlog must be defined during the Sprint Planning event?",choices:{A:"Just enough tasks for the Scrum Master to be confident in the Development Team's understanding of the Sprint.",B:"The entire Sprint Backlog must be identified and estimated by the end of the Sprint Planning meeting.",C:"Enough so the Development Team can create its best forecast of what is can do, and to start the first several days of the Sprint.",D:"Just enough to understand design and architectural implications."},correct:["C"]},
  {question:"Who is responsible for managing the progress of work during a Sprint?",choices:{A:"The Scrum Master.",B:"The Development Team.",C:"The Product Owner.",D:"The most junior member of the Team."},correct:["B"]},
  {question:"A Development Team is required to deliver a done Increment by the end of a Sprint. Select two statements that explain what Done means. (Choose two.)",choices:{A:"All work the Development Team is willing to do.",B:"Ready for integration.",C:"No work left from the definition of Done.",D:"Whatever the Product Owner defines as quality.",E:"Ready to be released to end users."},correct:["C","E"]},
  {question:"What two factors are best considered when establishing the Sprint length? (Choose two.)",choices:{A:"The organization has mandated similar length sprints.",B:"The level of uncertainty over the technology to be used.",C:"The frequency at which team formation can be changed.",D:"The risk of being disconnected from the stakeholders."},correct:["B","D"]},
  {question:"Which of the following are true about the length of the Sprint? (Choose two.)",choices:{A:"The length of the Sprint should be proportional to the work that is done in between Sprints.",B:"It is best to have Sprints of consistent length throughout a development effort.",C:"Sprint length is determined during Sprint Planning, and should hold the time it will take to code the planned features in the upcoming Sprint, but does not include time for any testing.",D:"Sprint length is determined during Sprint Planning, and should be long enough to make sure the Development Team can deliver what is to be accomplished in the upcoming Sprint.",E:"All Sprints must be 1 month or less."},correct:["B","E"]},
  {question:"What are two responsibilities of testers in a Scrum Team? (Choose two.)",choices:{A:"Verifying the work of programmers.",B:"Everyone in the Development Team is responsible for quality.",C:"Tracking quality metrics.",D:"Finding bugs.",E:"Scrum has no tester role."},correct:["B","E"]},
  {question:"The CEO asks the Development Team to add a very important item to a Sprint that is in progress. What should the Development Team do?",choices:{A:"Add the item to the current Sprint and drop an item of equal size.",B:"Add the item to the current Sprint without any adjustments.",C:"Inform the Product Owner so he/she can work with the CEO.",D:"Add the item to the next Sprint."},correct:["C"]},
  {question:"What is the role of management in Scrum? (Choose the best answer.)",choices:{A:"To present the Scrum Teams with insights and resources that help them improve.",B:"To monitor the Development Team's productivity.",C:"To identify and remove people that aren't working hard enough.",D:"To continually monitor staffing levels of the Scrum Team."},correct:["A"]},
  {question:"Which technique is the best way the Scrum Master can ensure that the Development Team communicates effectively with the Product Owner?",choices:{A:"Monitor communications between them and facilitate direct collaboration.",B:"Teach the Development Team to talk in terms of business needs and objectives.",C:"Teach the Product Owner about the technologies employed during the Sprints.",D:"Act as a go-between for them."},correct:["A"]},
  {question:"The time-box for a Daily Scrum is:",choices:{A:"Two minutes per person.",B:"15 minutes.",C:"The same time of day every day.",D:"4 hours."},correct:["B"]},
  {question:"Which phrase best describes a Product Owner?",choices:{A:"Go-between development team and customers.",B:"Value optimizer.",C:"Requirements engineer.",D:"Team manager."},correct:["B"]},
  {question:"The length of a Sprint should be:",choices:{A:"Short enough to keep the business risk acceptable to the Product Owner.",B:"Short enough to be able to synchronize the development work with other business events.",C:"No more than one calendar month.",D:"All of these answers are correct."},correct:["D"]},
  {question:"What is the Product Owner responsible for during the Sprint Retrospective? (Choose the best answer.)",choices:{A:"Participating as a Scrum Team member.",B:"Summarizing and reporting the discussions to the stakeholders that they represent in the Scrum Team.",C:"Capturing requirements for the Product Backlog.",D:"The Product Owner should not take part in Sprint Retrospectives."},correct:["A"]},
  {question:"Marian is the Product Owner envisioning a project for a new release of her product. She made a projection of a release date based upon a sustained velocity of 17 completed units of work per Sprint. Over the first 3 Sprints, the average velocity was 13 for work that the Development Team estimated as 90% done. The Development Teams, feeling the need to meet the plan, figured that a velocity of 17 was within their reach. A good way to continue is:",choices:{A:"The Development Team makes sure that all of the selected scope per Sprint is as Done as possible. The undone work is estimated and added to the Sprint Backlog of the next Sprint, so it doesn't mess up the Product Backlog.",B:"Add enough people to the Development Team for the deadline to be made.",C:"The opportunity to inspect and adapt is lost. Opaqueness has replaced transparency. Predictability has dropped below zero. The produced software is not usable. As the rules of Scrum have not been respected, it is the Scrum Master's duty to assess whether repair is possible, or a restart with a more reliable team. If not, the Scrum Master should cancel the project.",D:"The Development Team should remind Marian to find funding for enough Release Sprints in which the remaining work can be done."},correct:["D"]},
  {question:"The Product Owner is not collaborating with the Development Team during the Sprint. What are two valuable actions for a Scrum Master to take? (Choose two.)",choices:{A:"Inform the Product Owner's functional manager.",B:"Stop the Sprint, send the Product Owner to a course and restart.",C:"Bring up the problem in the Sprint Retrospective.",D:"Coach the Product Owner in the values of Scrum and incremental delivery.",E:"Nominate a proxy Product Owner."},correct:["C","D"]},
  {question:"True or False: Multiple Scrum Teams working on the same product or system all select work from the same Product Backlog.",choices:{A:"True",B:"False"},correct:["A"]},
  {question:"For the purpose of transparency, when does Scrum say a valuable and useful increment must be available? (Choose the best answer.)",choices:{A:"After the Acceptance Testing phase.",B:"Before the release Sprint.",C:"Every 3 Sprints.",D:"At the end of every Sprint.",E:"When the Product Owner asks to create one."},correct:["D"]},
  {question:"Multiple Scrum Teams working on the same project must have the same Sprint start date.",choices:{A:"True",B:"False"},correct:["B"]},
  {question:"What is a Development Team responsible for? (Choose two.)",choices:{A:"Resolving internal team conflicts.",B:"Reporting productivity.",C:"Selecting the Product Owner.",D:"Organizing the work required to meet the Sprint Goal."},correct:["A","D"]},
  {question:"Which two ways of creating Development Teams are consistent with Scrum's values? (Choose two.)",choices:{A:"Existing teams propose how they would like to go about organizing into the new structure.",B:"Managers personally re-assign current subordinates to new teams.",C:"Managers collaborate to assign individuals to specific teams.",D:"Bring all the developers together and let them self-organize into Development Teams.",E:"The Chief Product Owner determines the new team structures and assignments."},correct:["A","D"]},
  {question:"A Scrum Master is essentially the same thing as a traditional PM (Project Manager).",choices:{A:"True",B:"False"},correct:["B"]},
  {question:"A Product Owner wants advice from the Scrum Master about estimating work in Scrum. What guidance should a Scrum Master give? (Choose the best answer.)",choices:{A:"Product Backlog items must be estimated in story points.",B:"Estimates are made by the people doing the work.",C:"Estimates must be in relative units.",D:"Scrum forbids estimating.",E:"Estimates are made by the Product Owner, but are best checked with the Developers."},correct:["B"]},
  {question:"What is the timebox for the Sprint Planning event?",choices:{A:"4 Hours for a monthly Sprint.",B:"8 Hours for a monthly Sprint.",C:"Monthly.",D:"Whenever it is done."},correct:["B"]},
  {question:"Which Scrum Value is affected by a lack of trust in the Scrum Team?",choices:{A:"Focus",B:"Respect",C:"Openness",D:"Courage",E:"Commitment",F:"All of the above"},correct:["F"]},
  {question:"A Scrum Master is keeping a list of open impediments, but it is growing and he/she has been able to resolve only a small portion of the impediments. Which three techniques would be most helpful in this situation? (Choose three.)",choices:{A:"Consulting with the Development Team.",B:"Prioritizing the list and working on them in order.",C:"Arranging a triage meeting with all project managers.",D:"Alerting management to the impediments and their impact."},correct:["A","B","D"]},
  {question:"A product Increment must be released to production at the end of each Sprint.",choices:{A:"True",B:"False"},correct:["B"]},
  {question:"If burndown charts are used to visualize progress, what do they track?",choices:{A:"Accumulated cost.",B:"Individual worker productivity.",C:"Work remaining across time.",D:"Accumulated business value delivered to the customer."},correct:["C"]},
  {question:"How is management external to the Scrum Team involved in the Daily Scrum?",choices:{A:"The Scrum Master speaks on their behalf.",B:"Managers are not required at the Daily Scrum.",C:"Management gives an update at the start of each Daily Scrum.",D:"The Product Owner represents their opinions."},correct:["B"]},
  {question:"True or False: To get started in terms of what to build, Scrum requires no more than a Product Owner with enough ideas for a first Sprint, a Development Team to implement those ideas and a Scrum Master to help guide the process.",choices:{A:"True",B:"False"},correct:["A"]},
  {question:"What is the timebox for the Sprint Review?",choices:{A:"As long as needed.",B:"2 hours for a one-month Sprint.",C:"4 hours for a one-month Sprint.",D:"1 day"},correct:["C"]},
  {question:"Who is responsible for tracking the remaining work of the Sprint?",choices:{A:"The Development Team.",B:"The Scrum Master.",C:"The Project Manager.",D:"The Development Team is consultation with the Product Owner.",E:"The Product Owner."},correct:["A"]},
  {question:"What is the tactic a Scrum Master should use to divide a group of 100 people into multiple Development Teams?",choices:{A:"Create teams based on their skills across multiple layers (such as database, UI, etc.)",B:"Ask the Product Owner to assign the people to teams.",C:"Ask the developers to divide themselves into teams."},correct:["C"]},
  {question:"Which statement best describes a Product Owner's responsibility? (Choose the best answer.)",choices:{A:"Optimizing the value of the work the Scrum Team does.",B:"Ensuring that the work meets the commitments to the stakeholders.",C:"Directing the Development Team.",D:"Keep stakeholders from distracting the Development Team."},correct:["A"]},
  {question:"The Sprint Review is mainly an inspect and adapt opportunity for which group?",choices:{A:"The Development Team and stakeholders.",B:"The Product Owner and Development Team.",C:"The Scrum Team and stakeholders.",D:"The Product Owner and management.",E:"The Development Team and management.",F:"The Product Owner and stakeholders."},correct:["C"]},
  {question:"Which of the following best describes an increment of working software?",choices:{A:"A decomposition of all Product Backlog items into tasks for future Sprint Backlog lists.",B:"Additional features in a usable state that complement those delivered in previous iterations.",C:"A new user interface design for functionality delivered in previous iterations.",D:"An automated test suite to verify functionality delivered in previous iterations.",E:"UML diagrams that describe how to deliver functionality in future iterations."},correct:["B"]},
  {question:"In order to achieve the benefits of Scrum, it is important to enact the value of commitment. What two actions demonstrate the commitment of Scrum Team members? (Choose two.)",choices:{A:"Always deliver the items in the Sprint forecast.",B:"Help the other Scrum Team members.",C:"Do your best.",D:"Send out a daily status report.",E:"Work late."},correct:["B","C"]},
  {question:"The Product Owner determines how many Product Backlog items the Development Team selects for a Sprint.",choices:{A:"False.",B:"True, accordingly to what was committed to the stakeholders.",C:"True, but only after confirmation by the resource manager that the Team has enough capacity.",D:"True.",E:"False, the Scrum Master does that.",F:"False, capacity and commitment are the Project manager's responsibility."},correct:["A"]},
  {question:"Which three of the following are feedback loops in Scrum? (Choose three.)",choices:{A:"Sprint Review.",B:"Release Planning.",C:"Sprint Retrospective.",D:"Refinement Meeting.",E:"Daily Scrum."},correct:["A","C","E"]},
  {question:"When a Development Team is having trouble delivering a working Increment because they don't understand a functional requirement, what should they do?",choices:{A:"Add a specialist to the Development Team.",B:"Partially complete the functionality, and discuss the remaining work at the Sprint Review.",C:"Collaborate with the Product Owner to determine what is possible and acceptable.",D:"Defer the work to a more appropriate Sprint."},correct:["C"]},
  {question:"When is the Sprint Backlog created?",choices:{A:"At the beginning of the project.",B:"During the Sprint Planning meeting.",C:"Prior to the Sprint Planning meeting.",D:"During the Sprint."},correct:["B"]},
  {question:"Which of the following services are appropriate for a Scrum Master in regard to the Daily Scrum?",choices:{A:"Lead the discussions of the Development Team.",B:"Make sure that all 3 questions have been answered by each member of the team.",C:"Keep track of whether each team member has a chance to speak.",D:"Teach the Development Team to keep the Daily Scrum within the 15-minute time-box.",E:"All of the above."},correct:["D"]},
  {question:"Which of the following might the Scrum Team discuss during a Sprint Retrospective?",choices:{A:"Methods of communication.",B:"The way the Scrum Team does Sprint Planning.",C:"Skills needed to improve the Development Team's ability to deliver.",D:"Its Definition of Done.",E:"All of the above."},correct:["E"]},
  {question:"What are the two primary ways a Scrum Master keeps a Development Team working at its highest level of productivity? (Choose two.)",choices:{A:"By ensuring the meetings start and end at the proper time.",B:"By keeping high value features high in the Product Backlog.",C:"By facilitating Scrum Team decisions.",D:"By removing impediments that hinder the Scrum Team."},correct:["C","D"]},
  {question:"What is the recommended size for a Scrum Team?",choices:{A:"7 plus or minus 3.",B:"At least 7.",C:"9.",D:"10 or fewer."},correct:["D"]},
  {question:"You are the Scrum Master of a new, to be developed product. Development is going to require 45 people. What is a good first question for you to suggest the group thinks about when forming into teams?",choices:{A:"How will we make sure all teams have the right amount of expertise?",B:"What is the right mixture of senior and junior people on each team?",C:"Who are going to be the team leads?",D:"Who are the subject matter experts on each team?"},correct:["A"]},
  {question:"Which two activities will a Product Owner engage in during a Sprint? (Choose two.)",choices:{A:"Run the Daily Scrum.",B:"Prioritize the Development Team's work on the Sprint Backlog.",C:"Update the Sprint burndown chart.",D:"Answer questions from the Development Team about items in the current Sprint.",E:"Work with the stakeholders."},correct:["D","E"]},
  {question:"Which of the following are topics for the Developers to discuss at the Daily Scrum as they inspect their progress toward the Sprint Goal? (Choose three.)",choices:{A:"What have we learned since yesterday, and how should we modify our plan to increase our ability to meet the Sprint Goal?",B:"Are there any impediments blocking progress toward the Sprint Goal?",C:"What will I be working on tomorrow?",D:"Why were you late?",E:"How many hours did I spend on the project yesterday?",F:"Are there any decisions that need to be made to maintain progress toward the Sprint Goal?",G:"Will today's work negatively impact our ability to meet the Sprint Goal for the Sprint following this one?"},correct:["A","B","F"]},
  {question:"Cross-functional teams are optimized to work on one technical layer of a system only (e.g. GUI, database, middle tier, interfaces).",choices:{A:"True",B:"False"},correct:["B"]},
  {question:"A Scrum Master is working with a Scrum Team that has members in different physical locations. The Developers meet in a variety of meeting rooms and have much to do logistically (for example: reserve meeting rooms and set up conference calls) before the Daily Scrum. What action should the Scrum Master take?",choices:{A:"Allow the Developers to self-manage and determine for themselves what to do.",B:"Set up the meeting and tell the Scrum Team that is how it will be done.",C:"Ask the Developers to alternate who is responsible for meeting setup.",D:"Inform management and ask them to solve it."},correct:["A"]},
  {question:"What are two good ways for a Scrum Team to ensure security concerns are satisfied? (Choose two.)",choices:{A:"Postpone the work until a specialist can perform a security audit and create a list of security-related Product Backlog items.",B:"Add security concerns to the definition of Done.",C:"Add a Sprint to specifically resolve all security concerns.",D:"Delegate the work to the concerned department.",E:"Have the Scrum Team create Product Backlog items for each concern."},correct:["B","E"]},
  {question:"Which are properties of the Daily Scrum? (Choose two.)",choices:{A:"It is facilitated by the team lead.",B:"It is held first thing in the morning.",C:"It is fifteen minutes or less in duration.",D:"It is free from and designed to promote conversation.",E:"It consists of the Scrum Master asking the Team members the three questions.",F:"Its location and time remain constant."},correct:["C","F"]},
  {question:"Every Scrum Team must have a Product Owner and Scrum Master.",choices:{A:"True. Outcomes affected by their participation and availability.",B:"False. A Product Owner can be replaced by a business analyst in the Development Team.",C:"False. A Scrum Master is only required when asked for by the Development Team.",D:"True. Each must be 100% dedicated to the Scrum Team."},correct:["A"]},
  {question:"Who can abnormally terminate a Sprint?",choices:{A:"The Scrum Master",B:"The Development Team or its members.",C:"The Product Owner",D:"The Stakeholders"},correct:["C"]},
  {question:"The Sprint Goal is a result of Sprint Planning, as is the Sprint Backlog.",choices:{A:"True",B:"False"},correct:["A"]},
  {question:"Which two of the following are appropriate topics for discussion during a Sprint Retrospective? (Choose two.)",choices:{A:"Identifying high priority process improvements for the next Sprint.",B:"The order of items in the Product Backlog.",C:"How the team collaborates.",D:"Documenting acceptance criteria for items in the next Sprint."},correct:["A","C"]},
  {question:"When should a Sprint Goal be created?",choices:{A:"It should have been created in the previous Sprint during Product Backlog refinement.",B:"It must be established before Sprint Planning in order to begin planning.",C:"A Sprint Goal is not mandatory in Scrum.",D:"At any time during the Sprint.",E:"During Sprint Planning."},correct:["E"]},
  {question:"During a Sprint Retrospective, the Development Team proposes moving the Daily Scrum to only occur on Tuesdays and Thursdays. Which two are the most appropriate responses for the Scrum Master? (Choose two.)",choices:{A:"Consider the request and decide on which days the Daily Scrum should occur.",B:"Coach the team on why the Daily Scrum is important as an opportunity to update the plan.",C:"Have the developers vote",D:"Learn why the Development Team wants this and work with them to improve the outcome of the Daily Scrum.",E:"Acknowledge and support the self-organizing team's decision."},correct:["B","D"]},
  {question:"As the Development Team starts work during the Sprint, it realizes it has selected too much work to finish in the Sprint. What should it do?",choices:{A:"Inform the Product Owner at the Sprint Review, but prior to the demonstration.",B:"Find another Scrum Team to give the excess work to.",C:"As soon as possible in the Sprint, work with the Product Owner to remove some work or Product Backlog items.",D:"Reduce the definition of Done and get all of the Product Backlog items Done by the new definition."},correct:["C"]},
  {question:"In accordance with Scrum theory, how should a group of 100 people be divided into multiple Development Teams?",choices:{A:"Understanding the product, the product vision and the rules of the Scrum framework, the group divides itself into teams.",B:"It doesn't really matter because you can rotate the teams every Sprint to spread knowledge.",C:"Check with the allocation department to see who has worked together before and make these the first teams.",D:"Create a matrix of skills, seniority, and level of experience to assign people to teams."},correct:["A"]},
  {question:"A Sprint Retrospective should be held:",choices:{A:"At the end of each Sprint.",B:"At the beginning of each Sprint.",C:"Only when the Scrum Team determines it needs one.",D:"At the end of the last Sprint in a project or a release."},correct:["A"]},
  {question:"A new Developer is having continuing conflicts with existing members of the Scrum Team, which is impacting the delivery of the Increment. If necessary, who is responsible for removing the Developer from the Scrum Team?",choices:{A:"The hiring manager is responsible, because they hired the Developer.",B:"The Product Owner is responsible, because they control the return on investment (ROI).",C:"The Scrum Master is responsible, because they remove Impediments.",D:"The Scrum Team is responsible."},correct:["D"]},
  {question:"Which three purposes does the definition of Done serve? (Choose three.)",choices:{A:"Guide the Development Team on how many Product Backlog items to select for the Sprint.",B:"Create a shared understanding of when work is complete.",C:"Describe the purpose, objective, and time-box of each Scrum event.",D:"Describe the work that must be done before the Sprint is allowed to end.",E:"Increase transparency."},correct:["A","B","E"]},
  {question:"True or False: The Product Owner makes sure the Developers select enough from the Product Backlog for a Sprint to satisfy the stakeholders.",choices:{A:"True",B:"False"},correct:["B"]},
  {question:"Which statement best describes the Sprint Review?",choices:{A:"It is used to congratulate the Development Team if it did what it forecast, or to punish the Development Team if it failed to meet its forecast.",B:"It is a demo at the end of the Sprint for everyone in the organization to check on the work done.",C:"It is a mechanism to control the Development Team's activities during a Sprint.",D:"It is when the Scrum Team and stakeholders inspect the outcome of a Sprint and figure out what to do next."},correct:["D"]},
  {question:"Who owns the Sprint Backlog?",choices:{A:"The Scrum Team.",B:"The Product Owner.",C:"The Scrum Master.",D:"The Development Team."},correct:["D"]},
  {question:"When might a Sprint be cancelled?",choices:{A:"When the Developers determine the product plan is infeasible.",B:"When the Sprint Goal becomes obsolete.",C:"When the sales department has an important new opportunity.",D:"When it becomes clear that not everything will be finished by the end of the Sprint."},correct:["B"]},
  {question:"Every Development Team should have:",choices:{A:"At least one representative from each major software engineering discipline; such as, Quality Assurance, Development, and User Experience.",B:"The competencies and skills needed to deliver a Done Increment in a Sprint.",C:"One Lead Developer and no more than 8 other members."},correct:["B"]},
  {question:"Why does the Product Owner want the Development Team to adhere to its definition of Done?",choices:{A:"To have complete transparency into what has been done at the end of each Sprint.",B:"To be able to reprimand the team when they don't meet their velocity goal for the Sprint.",C:"To know what the team will deliver over the next three Sprints.",D:"To predict the team's productivity over time."},correct:["A"]},
  {question:"During a Sprint Retrospective, for what is the Scrum Master responsible?",choices:{A:"Prioritizing the resulting action items.",B:"Participating as a Scrum team member and facilitating as requested or needed.",C:"Acting as a scribe to capture the Development Team's answers.",D:"Summarizing and reporting the discussions to management."},correct:["B"]},
  {question:"The Development Team should have all the skills needed to:",choices:{A:"Turn Product Backlog items into a valuable, useful Increment.",B:"Do all of the development work, except for specialized testing that requires additional tools and environments.",C:"Complete the project within the date and cost as calculated by the Product Owner."},correct:["A"]},
  {question:"The Scrum Master observes the Product Owner struggling with ordering the Product Backlog. What is an appropriate action for the Scrum Master to take?",choices:{A:"Suggest the Product Owner extend the Sprint, so he can have more time to order the Product Backlog.",B:"Suggest that the Development Team does the ordering to be sure that it is a feasible ordering of work.",C:"Offer the Product Owner help in understanding that the goal of ordering the Product Backlog is to maximize value.",D:"Present the Product Owner with an ordered Product Backlog to use.",E:"Encourage the Product Owner to work with the Development Team to see which items technically are fastest to implement."},correct:["C"]},
  {question:"Which two things are appropriate for a Scrum Master to do if the Scrum Team doesn't have the tools and environment to completely finish each selected Product Backlog item? (Choose two.)",choices:{A:"Coach the ScrumTeam to improve its skills, tools, and infrastructure over time and adjust the Definition of Done accordingly.",B:"Encourage the Product Owner to accept partially Done increments until the situation improves.",C:"Refocus the current Sprint on establishing the Scrum Team's environment instead of delivering an Increment.",D:"Declare the Scrum Team not ready for Scrum.",E:"Have the Scrum Team establish a Definition of Done that is actually possible to achieve given current circumstances."},correct:["A","E"]},
  {question:"When is implementation of a Product Backlog item considered complete?",choices:{A:"At the end of the Sprint.",B:"When the item has no work remaining in order to be potentially released.",C:"When Quality Assurance reports that the item passes all acceptance criteria.",D:"When all work in the Sprint Backlog related to the item is finished."},correct:["B"]},
  {question:"Choose two responsibilities of a self-organizing Development Team. (Choose two.)",choices:{A:"Reorder the Product Backlog.",B:"Pull Product Backlog items for the Sprint.",C:"Do the work planned in the Sprint Backlog.",D:"Increase velocity.",E:"Report daily progress to stakeholders."},correct:["B","C"]},
  {question:"If two Scrum Teams are added to the development of a product that previously had only one Scrum Team, what will be the immediate impact on the productivity of the original Scrum Team? (Choose the best answer.)",choices:{A:"Its productivity is likely to decrease.",B:"Its productivity is likely to stay the same.",C:"Its productivity is likely to increase.",D:"We do not know until a Sprint has run."},correct:["A"]},
  {question:"A Scrum Master is introducing Scrum to a new Team. The Team has decided that a Sprint Retrospective is unnecessary. What action should the Scrum Master take?",choices:{A:"Call a meeting between the Scrum Team and senior management.",B:"Comply with the decision of the self-organizing team.",C:"Consult with the Product Owner to see how they feels about the situation.",D:"Begin facilitating productive and useful Sprint Retrospectives."},correct:["D"]},
  {question:"Which of the following are true about the Product Owner role? (Choose two.)",choices:{A:"The Product Owner is one person.",B:"The Product Owner is accountable for ordering the Product Backlog.",C:"Multiple people can share the Product Owner role on a Scrum Team.",D:"The Product Owner role can be played by a committee or a team of people."},correct:["A","B"]},
  {question:"When multiple teams work together on the same product, each team should maintain a separate Product Backlog.",choices:{A:"True",B:"False"},correct:["B"]},
  {question:"When does the second Sprint start?",choices:{A:"Once the architectural changes for the second Sprint have been approved by the senior architect.",B:"After the Product Backlog for the second Sprint has been selected.",C:"Immediately after the first Sprint.",D:"After the customer completes acceptance testing of the first Sprint."},correct:["C"]},
  {question:"What is included in the Sprint Backlog?",choices:{A:"User Stories.",B:"Tasks.",C:"Use Cases.",D:"Tests.",E:"Any of the above (or others) which are a decomposition of the selected Product Backlog items."},correct:["E"]},
  {question:"What enhances the transparency of an Increment?",choices:{A:"Doing all work needed to meet the definition of Done",B:"Reporting Sprint progress to the stakeholders daily",C:"Keeping track of and estimating all undone work to be completed in a separate Sprint.",D:"Updating Sprint tasks properly in the electronic tracking tool."},correct:["A"]},
  {question:"Who determines how work is performed during the Sprint?",choices:{A:"Architects.",B:"The Development Team.",C:"The Scrum Master.",D:"Subject matter experts.",E:"Development Team managers."},correct:["B"]},
  {question:"Why should the Product Owner be present at the Daily Scrum?",choices:{A:"He/She doesn't need to be there.",B:"To hear about impediments in functionality.",C:"To represent the stakeholders' point of view.",D:"To participate as a Scrum Team member."},correct:["A"]},
  {question:"What two techniques could the Scrum Master use when the Scrum Team gets caught in an internal disagreement about which development techniques to apply? (Choose two.)",choices:{A:"Involve the complete Development Team.",B:"Use coaching techniques; such as open questions and active listening.",C:"Ask an external technical specialist to make the decision.",D:"Send every team member to the company's Human Resources department to express their concerns."},correct:["A","B"]},
  {question:"Who is responsible for clearly expressing Product Backlog items?",choices:{A:"The Scrum Master, or the Scrum Master may have the Development Team do it.",B:"The Scrum Master.",C:"The Product Owner.",D:"The business analyst who represents the Product Owner in the Development Team."},correct:["C"]},
  {question:"What is the best suited structure for Development Teams in order to produce integrated Increments?",choices:{A:"Each Development Team works only one technical layer of the system (e.g. GUI, database, middle tier, interfaces).",B:"Each Development Team develops functionality from beginning to end throughout all technical layers."},correct:["B"]},
  {question:"What are three benefits of self-organization? (Choose three.)",choices:{A:"Increased creativity.",B:"Increased rule compliance.",C:"Increased accuracy of estimates.",D:"Increased self-accountability",E:"Increased commitment."},correct:["A","D","E"]},
  {question:"Which three of the following are time-boxed events in Scrum? (Choose three.)",choices:{A:"Release Testing.",B:"Release Retrospective.",C:"Sprint Retrospective.",D:"Sprint Planning.",E:"Sprint Testing.",F:"Sprint 0.",G:"Daily Scrum."},correct:["C","D","G"]},
  {question:"At the end of a Sprint, a Product Backlog item worked on during the Sprint does not meet the definition of Done. What two things should happen with the undone Product Backlog item? (Choose two.)",choices:{A:"If the stakeholders agree, the Product Owner can accept it and release it to the users.",B:"Put it on the Product Backlog for the Product Owner to decide what to do with it.",C:"Review the item, add the Done part of the estimate to the velocity and create a Story for the remaining work.",D:"Do not include the item in the Increment this Sprint."},correct:["B","D"]},
  {question:"Which two of the following are true about the Scrum Master role? (Choose two.)",choices:{A:"At the Sprint Review, the Scrum Master identifies what work is done and not done.",B:"The Scrum Master teaches the Scrum team to use timeboxes.",C:"The Scrum Master helps those outside the team interact with the Scrum Team.",D:"The Scrum Master assigns tasks to Development Team members when they need work.",E:"The Scrum Master is responsible for updating the Sprint Burndown."},correct:["B","C"]},
  {question:"If burndown charts are used to visualize progress, what does a trend line through a release burndown chart indicate?",choices:{A:"The evolution of the cost spent on the project.",B:"When all work will be completed to the Scrum Team can be released for other work.",C:"When the work remaining will likely be completed if nothing changes on the Product Backlog or the Development Team.",D:"When the project will be over if the Product Owner removes work that is equal in effort to any new work that is added."},correct:["C"]},
  {question:"Who is responsible for engaging the stakeholders?",choices:{A:"The Business Analyst.",B:"The Development Team.",C:"The Team Manager.",D:"The Project Manager.",E:"The Product Owner."},correct:["E"]},
  {question:"How much work is required of the Developers to complete a Product Backlog item selected during the Sprint Planning?",choices:{A:"A proportional amount of time on analysis, design, programming, testing.",B:"All development work and at least some testing.",C:"As much as they can fit into the Sprint, with remaining work deferred to the next Sprint.",D:"As much as is required to meet the Scrum Team's Definition of Done."},correct:["D"]},
  {question:"Which statement best describes the Sprint Backlog as outcome of the Sprint Planning?",choices:{A:"It is a complete list of all work to be done in a Sprint.",B:"Every item has a designated owner.",C:"Each task is estimated in hours.",D:"It is the Scrum Team's plan for the Sprint.",E:"It is ordered by the Product Owner."},correct:["D"]},
  {question:"What does it mean for a Scrum Team to be cross-functional? (Choose the best answer.)",choices:{A:"The Scrum Team includes not only developers but also business analysts, architects, and testers.",B:"The Scrum Team includes cross-skilled individuals who are able to contribute to do what is necessary to deliver an increment.",C:"Developers on the Scrum Team work closely with business analysts, architects, developers and testers who are not on the team.",D:"The Scrum Team is a virtual team drawing from separate teams of business analysts, architects, developers and testers."},correct:["B"]},
  {question:"Sprint burndown charts are an efficient tracking tool, because they show:",choices:{A:"An estimate of the total work remaining for the Sprint.",B:"How much effort has gone into a Sprint.",C:"How many hours have been worked by each Development Team member.",D:"How many Product Backlog items remain."},correct:["A"]},
  {question:"Which topics should be discussed in the Sprint Review?",choices:{A:"The Scrum process, and how it was used during the Sprint.",B:"Coding and engineering practices.",C:"Sprint results.",D:"All of the above."},correct:["C"]},
  {question:"A member of the Development Team takes the Scrum Master aside to express his concerns about data security issues. What should the Scrum Master do?",choices:{A:"Add security to the definition of Done.",B:"Tell the Product Owner to stop further development of features until the issues are fixed.",C:"Create a Product Backlog item for security.",D:"Go check with the testers.",E:"Ask the person to share the issue with the team as soon as possible."},correct:["E"]},
  {question:"The Product Backlog is ordered by:",choices:{A:"The Product Owner with the most valuable items placed at the top.",B:"Risk, where safer items are at the top, and riskier items are at the bottom.",C:"Items are randomly arranged.",D:"Size, where small items are at the top and large items are at the bottom."},correct:["A"]},
  {question:"What happens if the Scrum Team cannot complete its work by the end of the Sprint?",choices:{A:"The Sprint is extended and future Sprints use this new duration.",B:"The Sprint length is unchanged and the Scrum Team continuously learns and adapts.",C:"The Sprint is extended temporarily. Lessons are taken to ensure it doesn't happen again."},correct:["B"]},
  {question:"User documentation is part of your definition of Done. However, there aren't enough technical writers for all teams. Your Scrum Team doesn't have a technical writer. What should the Scrum Team do?",choices:{A:"Form a separate team of technical writers that will work on an on-demand basis for the various Product Owners. Work order will be first in, first out.",B:"Let the user documentation remain undone and accumulate until after the last development Sprint. It will then be done by any available technical writers.",C:"Wait until you have a technical writer on your Development Team to take care of this.",D:"The Developers on the Scrum Team should write the user documentation."},correct:["D"]},
  {question:"You are the Scrum Master for four Scrum Teams working from the same Product Backlog. Several of the developers come to you complaining that work identified for the upcoming two Sprints will require full-time commitment from a technical specialist who is external to the teams. What are two key concerns for the Scrum Master to take into account in this situation? (Choose two.)",choices:{A:"The desire to maintain a stable velocity.",B:"The benefit of Development Teams figuring out a solution for themselves.",C:"The need to have enough work to keep all Development Team members busy.",D:"The ability of the Scrum Teams to produce integrated Increments."},correct:["B","D"]},
  {question:"You have just been hired by a company new to Scrum. Your management has assigned you to be the Scrum Master of six new Scrum Teams. These teams will build one product. Select two conditions you should strive for in this scenario. (Choose two.)",choices:{A:"There should be six Product Owners, one for each Scrum Team.",B:"There should be six Product Owners, reporting to a chief Product Owner.",C:"The product has one Product Backlog.",D:"Each Scrum Team should have a separate Product Backlog.",E:"There should be only one Product Owner."},correct:["C","E"]},
  {question:"A Scrum Team has been working on a product for nine Sprints. A new Product Owner comes in, understanding he is accountable for the Product Backlog. However, he is unsure about his responsibilities. Which two activities are part of the Product Owner role according to Scrum? (Choose two.)",choices:{A:"Ensuring that the most valuable functionality is produced first, at all times.",B:"Interacting with stakeholders.",C:"Providing the Development Team with detailed specifications.",D:"Describing features as Use Cases.",E:"Creating detailed functional test cases."},correct:["A","B"]},
  {question:"Which are NOT appropriate topics for discussion in a Sprint Retrospective? (Choose two.)",choices:{A:"Definition of Done.",B:"How the team does its work.",C:"Team relations.",D:"The value of work currently represented in the Product Backlog.",E:"Arranging the Sprint Backlog for the next Sprint."},correct:["D","E"]},
  {question:"What activities would a Product Owner typically undertake in the phase between the end of the current Sprint and the start of the next Sprint?",choices:{A:"There are no such activities. The next Sprint starts immediately after the current Sprint.",B:"Refine the Product Backlog.",C:"Work with the Quality Assurance departments on the Increment of the current Sprint.",D:"Update the project plan with stakeholders."},correct:["A"]},
  {question:"Who is on the Scrum Team? (Choose all that apply.)",choices:{A:"Scrum Master",B:"Product Owner",C:"Developer",D:"Project Manager",E:"None of the above"},correct:["A","B","C"]},
  {question:"Which of the following are roles on a Scrum Team? (Choose three.)",choices:{A:"Users",B:"Scrum Master",C:"Product Owner",D:"Development Team",E:"Customers"},correct:["B","C","D"]},
  {question:"Which does a self-organizing Development Team choose?",choices:{A:"Sprint length.",B:"How to best accomplish its work.",C:"Stakeholders for the Sprint Review.",D:"When to release, based on its progress.",E:"Product Backlog ordering."},correct:["B"]}

function tryLoadFile(){
  // Cargar primero desde los datos embebidos
  document.getElementById('loader').textContent='Preguntas cargadas desde datos locales.';
  startWithText(null, true);
}

function startWithText(raw, useEmbedded){
  document.getElementById('import').style.display='none';
  const questions = useEmbedded ? PREGUNTAS_EMBEBIDAS : parseQuestions(raw);
  if(!questions.length){
    document.getElementById('loader').textContent='No se detectaron preguntas. Revisa el formato o pega manualmente el contenido.';
    document.getElementById('import').style.display='block';
    if(raw) document.getElementById('raw').value = raw;
    return;
  }
  window.quiz = {questions, idx:0, answers: [], showingFeedback: false};
  
  // Mostrar UI de estadísticas y navegación
  document.getElementById('stats').style.display = 'flex';
  document.getElementById('questionNav').style.display = 'block';
  
  // Crear botones de navegación a preguntas
  const questionsContainer = document.getElementById('questionButtons');
  questionsContainer.innerHTML = '';
  for(let i = 0; i < questions.length; i++){
    const btn = document.createElement('button');
    btn.className = 'question-btn';
    btn.textContent = (i+1);
    btn.dataset.index = i;
    btn.addEventListener('click', ()=>{
      window.quiz.idx = i;
      window.quiz.showingFeedback = false;
      renderQuestion(i);
      updateQuestionButtons();
    });
    questionsContainer.appendChild(btn);
  }
  
  renderQuestion(0);
  document.getElementById('loader').style.display='none';
  document.getElementById('quiz').style.display='block';
}

function parseQuestions(text){
  // Divide por bloques que empiecen con "Question #" o líneas que parezcan comenzar una pregunta
  const blocks = text.split(/(?=Question\s+#\d+)/g);
  const qs = [];
  for(const b of blocks){
    const trimmed = b.trim();
    if(!trimmed) continue;
    // extraer la línea de cabecera y el cuerpo
    const headerMatch = trimmed.match(/Question\s+#\d+[^\n]*\n?/i);
    const body = headerMatch ? trimmed.slice(headerMatch[0].length).trim() : trimmed;

    // extraer "Correct Answer: ..."
    const correctMatch = body.match(/Correct Answer:\s*([A-Z0-9 ,]+)/i);
    const correctRaw = correctMatch ? correctMatch[1].trim() : null;

    // extraer opciones: lineas que empiezan por LETRA. (A. o A)
    const choiceRegex = /^(?:[A-Z])\.\s*(.*)$/gm;
    const choices = {};
    let m;
    while((m = choiceRegex.exec(body)) !== null){
      // m[0] contains full line; get the letter from the line start
      const line = m[0];
      const letterMatch = line.match(/^([A-Z])\./);
      if(!letterMatch) continue;
      const letter = letterMatch[1];
      choices[letter] = m[1].trim();
    }

    // si no se encontraron opciones, intentar extraer líneas que comienzan con "A. " etc sin anchors
    if(Object.keys(choices).length===0){
      const alt = body.match(/(?:\n|^)([A-Z])\.\s*(.*?)\n/g);
      if(alt){
        for(const l of alt){
          const lm = l.match(/([A-Z])\.\s*(.*)\n/);
          if(lm) choices[lm[1]] = lm[2].trim();
        }
      }
    }

    // extraer texto de la pregunta: todo hasta la primera opcion o hasta "Correct Answer"
    let qtext = body;
    const firstChoiceIdx = body.search(/(^|\n)[A-Z]\.\s/m);
    if(firstChoiceIdx>=0) qtext = body.slice(0, firstChoiceIdx).trim();
    // remover líneas de Correct Answer si quedan
    qtext = qtext.replace(/Correct Answer:\s*[A-Z0-9 ,]+/i, '').trim();

    if(Object.keys(choices).length===0) continue; // no es un bloque de pregunta

    const correct = [];
    if(correctRaw){
      // normalizar combinaciones como "BD" o "B D" o "AB"
      const letters = correctRaw.replace(/[^A-Z]/g,'');
      for(const ch of letters) if(choices[ch]) correct.push(ch);
    }

    qs.push({question:qtext, choices, correct});
  }
  return qs;
}

function renderQuestion(i){
  const data = window.quiz.questions[i];
  const qwrap = document.getElementById('qwrap');
  qwrap.innerHTML = '';
  const div = document.createElement('div'); div.className='question';
  const h = document.createElement('div'); h.innerHTML = '<strong>Pregunta '+(i+1)+' de '+window.quiz.questions.length+'</strong>';
  const p = document.createElement('div'); p.style.marginTop='8px'; p.textContent = data.question;
  div.appendChild(h); div.appendChild(p);

  const choicesDiv = document.createElement('div'); choicesDiv.className='choices';
  const multiple = (Object.keys(data.correct||{}).length>1);
  const inputType = multiple ? 'checkbox' : 'radio';
  const given = window.quiz.answers[i] || [];
  const correct = data.correct || [];
  
  for(const L of Object.keys(data.choices).sort()){
    const label = document.createElement('label'); label.className='choice';
    const input = document.createElement('input'); input.type = inputType; input.name = 'q'+i; input.value = L; input.style.marginRight='8px';
    // restaurar respuesta previa
    if(given.indexOf(L)!==-1) input.checked = true;
    
    // Si estamos mostrando feedback, deshabilitar inputs
    if(window.quiz.showingFeedback) input.disabled = true;
    
    // Colorear según si es correcto/incorrecto
    if(window.quiz.showingFeedback){
      if(correct.indexOf(L)!==-1) label.style.color = 'green';
      else if(given.indexOf(L)!==-1) label.style.color = 'red';
    }
    
    label.appendChild(input);
    label.appendChild(document.createTextNode(L + '. ' + data.choices[L]));
    choicesDiv.appendChild(label);
  }
  div.appendChild(choicesDiv);
  
  // Mostrar retroalimentación si está disponible
  if(window.quiz.showingFeedback){
    const ok = given.length===correct.length && given.every(v=>correct.indexOf(v)!==-1);
    const feedback = document.createElement('div');
    feedback.style.marginTop = '14px';
    feedback.style.padding = '12px';
    feedback.style.borderRadius = '6px';
    if(ok){
      feedback.style.backgroundColor = '#c6f6d5';
      feedback.style.color = '#22543d';
      feedback.innerHTML = '<strong>✓ ¡Correcto!</strong>';
    } else {
      feedback.style.backgroundColor = '#fed7d7';
      feedback.style.color = '#742a2a';
      feedback.innerHTML = '<strong>✗ Incorrecto</strong><br/><small>Respuesta(s) correcta(s): '+correct.join(', ')+'</small>';
    }
    div.appendChild(feedback);
  }
  
  qwrap.appendChild(div);

  // botones
  document.getElementById('prev').style.display = !window.quiz.showingFeedback && i>0 ? 'inline-block' : 'none';
  document.getElementById('next').style.display = (window.quiz.showingFeedback || i<window.quiz.questions.length-1) ? 'inline-block' : 'none';
  document.getElementById('finish').style.display = i===window.quiz.questions.length-1 && window.quiz.showingFeedback ? 'inline-block' : 'none';
  
  // Cambiar texto del botón Next según estado
  if(window.quiz.showingFeedback){
    document.getElementById('next').textContent = i < window.quiz.questions.length-1 ? 'Siguiente pregunta' : 'Terminar y ver resultado';
  } else {
    document.getElementById('next').textContent = 'Siguiente';
  }
}

function saveCurrentAnswer(){
  const i = window.quiz.idx; const q = window.quiz.questions[i];
  const inputs = document.getElementsByName('q'+i);
  const sel = [];
  for(const inp of inputs) if(inp.checked) sel.push(inp.value);
  window.quiz.answers[i] = sel;
}

function showResult(){
  saveCurrentAnswer();
  let score = 0;
  const total = window.quiz.questions.length;
  const reviewHtml = [];
  for(let i=0;i<total;i++){
    const q = window.quiz.questions[i];
    const given = window.quiz.answers[i] || [];
    const correct = q.correct || [];
    // comparar (ignorar order)
    const ok = given.length===correct.length && given.every(v=>correct.indexOf(v)!==-1);
    if(ok) score++;
    let line = '<div class="question"><strong>Pregunta '+(i+1)+':</strong> '+escapeHtml(q.question)+'<br/>';
    line += '<div class="small">Tus respuestas: '+(given.length?given.join(', '):'<em>Sin respuesta</em>')+' - Respuesta(s) correcta(s): '+(correct.length?correct.join(', '):'<em>No especificada</em>')+'</div>';
    line += '<div style="margin-top:6px">';
    for(const L of Object.keys(q.choices).sort()){
      const txt = L + '. ' + q.choices[L];
      if(correct.indexOf(L)!==-1) line += '<div class="correct">'+escapeHtml(txt)+'</div>';
      else if(given.indexOf(L)!==-1) line += '<div class="wrong">'+escapeHtml(txt)+'</div>';
      else line += '<div>'+escapeHtml(txt)+'</div>';
    }
    line += '</div></div>';
    reviewHtml.push(line);
  }
  document.getElementById('result').innerHTML = '<h3>Resultado: '+score+' / '+total+'</h3>';
  document.getElementById('review').style.display='block';
  document.getElementById('review').innerHTML = reviewHtml.join('\n');
}

function escapeHtml(s){
  return s.replace(/[&<>"']/g, function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":"&#39;"}[c]});
}

// eventos
window.addEventListener('DOMContentLoaded', ()=>{
  tryLoadFile();
  document.getElementById('parseBtn').addEventListener('click', ()=>{
    const raw = document.getElementById('raw').value;
    startWithText(raw, false);
  });
  document.getElementById('next').addEventListener('click', ()=>{
    const i = window.quiz.idx;
    if(!window.quiz.showingFeedback){
      // Primera vez: guardar respuesta y mostrar feedback
      saveCurrentAnswer();
      window.quiz.showingFeedback = true;
      renderQuestion(i);
    } else {
      // Segunda vez: ir a siguiente pregunta
      if(i < window.quiz.questions.length-1){
        window.quiz.idx++;
        window.quiz.showingFeedback = false;
        renderQuestion(window.quiz.idx);
      }
    }
  });
  document.getElementById('prev').addEventListener('click', ()=>{
    saveCurrentAnswer();
    if(window.quiz.idx>0){ 
      window.quiz.idx--; 
      window.quiz.showingFeedback = false;
      renderQuestion(window.quiz.idx); 
    }
  });
  document.getElementById('finish').addEventListener('click', ()=>{
    showResult();
  });
});
</script>
